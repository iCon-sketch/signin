<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signin</title>
<style>
    body{
        background-color: rgb(4, 6, 34);
        margin: 0;
    }
    .container{
        background-color: burlywood;
        margin-left: auto;
        margin-right: auto;
        width: 400px;
        height: 520px;
        margin-top: 100px;
        border-radius: 30px;
    }
    .container h2{
        text-align: center;
        margin: 0;
        color: rgb(4, 6, 34);
        font-weight: 400;
        font-size: 33px;
        padding: 20px;
    }
    .container p{
        text-align: center;
        margin: 0;
       margin-right: 30px;
    }
    .field input{
        background-color: azure;
        margin-left: 35px;
        width: 254px;
        height: 60px;
        border: none;
        border-radius: 32px;
        padding: 10px;
        outline: none;
    }
    ::placeholder{
        color: rgb(4, 6, 34);
    }
    button{
        background-color: crimson;
        border: none;
        width: 131px;
        height: 50px;
        border-radius: 36px;
        margin-left: 100px;
        margin-top: 40px;
        color: rgb(255, 255, 255);
        
    }  
    form{
       margin-top: 50px;
       margin-left: 30px;}
.container a{
        text-decoration: none;
        color: rgb(0, 0, 255);
    }
button:hover{
        background-color: rgb(4, 6, 34);
        color: rgb(255, 255, 255);
    }
  
</style>

</head>
<body>
    <div class="container">
        <div class="text">
            <h2>Welcome Back!</h2>
            <p>Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
    <form action="">
        <div class="field">
            <input type="text" placeholder="Enter your email"><br><br>
            <input type="text" placeholder="Enter your password"><br><br>
            <button type="button">Sign in</button>
        </div>
    </form>
    
</body>
</html>
